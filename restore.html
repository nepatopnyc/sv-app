<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow"><title>Vault backup recovery (offline)</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#060b16;color:#e7eefc;margin:0}.w{max-width:560px;margin:0 auto;padding:24px 16px}
.c{background:#111d35;border:1px solid #1d2c4d;border-radius:16px;padding:18px}label{display:block;font-size:13px;color:#8a9bbd;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;background:#071022;border:1px solid #1d2c4d;color:#e7eefc;border-radius:10px;padding:11px;font-size:16px}
button{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;background:#7dff4a;color:#04110a}
.msg{white-space:pre-wrap;margin-top:12px;color:#7dff4a;font-size:14px;word-break:break-all}.bad{color:#ff4d5e}p{color:#8a9bbd;font-size:13px;line-height:1.5}</style></head>
<body><div class="w"><h1 style="font-size:20px">Backup recovery (offline)</h1>
<p>This page works with no internet connection and cannot send data anywhere (its security policy blocks all network access). Keep a copy of this file with your backup files.</p>
<div class="c"><label>Backup file (.nexbak)</label><input id="file" type="file"><label>Vault passphrase</label><input id="pass" type="password" autocomplete="off">
<button id="go">Verify and restore the original</button><div id="out" class="msg"></div></div></div>
<script>
// NEX vault core: pure functions (tested in Node and used by the page)
const NEXCORE = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  // ---- streaming SHA-256 ----
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  class Sha256 {
    constructor(){ this.h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]); this.buf=new Uint8Array(64); this.blen=0; this.total=0; this.w=new Uint32Array(64); }
    _block(b,o){ const w=this.w, h=this.h;
      for(let i=0;i<16;i++) w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
      for(let i=16;i<64;i++){ const a=w[i-15], c=w[i-2]; const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3); const s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
      let A=h[0],B=h[1],C=h[2],D=h[3],E=h[4],F=h[5],G=h[6],H=h[7];
      for(let i=0;i<64;i++){ const S1=((E>>>6)|(E<<26))^((E>>>11)|(E<<21))^((E>>>25)|(E<<7)); const ch=(E&F)^(~E&G); const t1=(H+S1+ch+K[i]+w[i])|0; const S0=((A>>>2)|(A<<30))^((A>>>13)|(A<<19))^((A>>>22)|(A<<10)); const mj=(A&B)^(A&C)^(B&C); const t2=(S0+mj)|0; H=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0; }
      h[0]=(h[0]+A)|0;h[1]=(h[1]+B)|0;h[2]=(h[2]+C)|0;h[3]=(h[3]+D)|0;h[4]=(h[4]+E)|0;h[5]=(h[5]+F)|0;h[6]=(h[6]+G)|0;h[7]=(h[7]+H)|0; }
    update(data){ const d=data instanceof Uint8Array?data:new Uint8Array(data); let i=0; this.total+=d.length;
      if(this.blen){ while(this.blen<64&&i<d.length) this.buf[this.blen++]=d[i++]; if(this.blen===64){ this._block(this.buf,0); this.blen=0; } }
      while(i+64<=d.length){ this._block(d,i); i+=64; }
      while(i<d.length) this.buf[this.blen++]=d[i++];
      return this; }
    hex(){ const bits=this.total*8; const pad=new Uint8Array(((this.blen<56)?56:120)-this.blen+8); pad[0]=0x80;
      const hi=Math.floor(bits/0x100000000), lo=bits>>>0; const L=pad.length; pad[L-8]=hi>>>24;pad[L-7]=hi>>>16;pad[L-6]=hi>>>8;pad[L-5]=hi;pad[L-4]=lo>>>24;pad[L-3]=lo>>>16;pad[L-2]=lo>>>8;pad[L-1]=lo;
      const total=this.total; this.update(pad); this.total=total;
      return Array.from(this.h).map(x=>(x>>>0).toString(16).padStart(8,'0')).join(''); }
  }
  // ---- base64 ----
  function b64(u8){ u8=u8 instanceof Uint8Array?u8:new Uint8Array(u8); let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
  function unb64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  // ---- keys ----
  const ITER=600000;
  async function deriveKek(pass, salt, iterations=ITER){
    const base=await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }
  async function gcmEnc(key, data){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data)); return {iv:b64(iv), ct:b64(ct)}; }
  async function gcmDec(key, box){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, key, unb64(box.ct))); }
  async function newFileKey(){ const raw=crypto.getRandomValues(new Uint8Array(32)); const key=await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']); return {raw, key}; }
  async function wrapFileKey(kek, raw){ return gcmEnc(kek, raw); }
  async function unwrapFileKey(kek, wrapped){ const raw=await gcmDec(kek, wrapped); return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']); }
  async function encChunk(key, plain){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain)); const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12); return out; }
  async function decChunk(key, blob){ const u=blob instanceof Uint8Array?blob:new Uint8Array(blob); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.subarray(0,12)}, key, u.subarray(12))); }
  async function encJson(key, obj){ return gcmEnc(key, te.encode(JSON.stringify(obj))); }
  async function decJson(key, box){ return JSON.parse(td.decode(await gcmDec(key, box))); }
  // ---- backup file (.nexbak): magic, header length, header JSON, encrypted chunks ----
  const MAGIC=te.encode('NEXBAK1\n');
  function packBackup(header, chunks){ const h=te.encode(JSON.stringify({...header, chunk_lengths:chunks.map(c=>c.length)})); const len=new Uint8Array(4); new DataView(len.buffer).setUint32(0,h.length);
    return [MAGIC, len, h, ...chunks]; }
  function parseBackup(u8){ for(let i=0;i<MAGIC.length;i++) if(u8[i]!==MAGIC[i]) throw new Error('Not a NEX backup file');
    const hl=new DataView(u8.buffer,u8.byteOffset+MAGIC.length,4).getUint32(0); let o=MAGIC.length+4; const header=JSON.parse(td.decode(u8.subarray(o,o+hl))); o+=hl;
    const chunks=[]; for(const L of header.chunk_lengths){ chunks.push(u8.subarray(o,o+L)); o+=L; } if(o!==u8.length) throw new Error('Backup file length mismatch'); return {header, chunks}; }
  return {Sha256, b64, unb64, ITER, deriveKek, gcmEnc, gcmDec, newFileKey, wrapFileKey, unwrapFileKey, encChunk, decChunk, encJson, decJson, packBackup, parseBackup};
})();
if (typeof module !== 'undefined') module.exports = NEXCORE;


const C = NEXCORE; const $ = id => document.getElementById(id);
function saveBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); }
$('go').onclick = async () => {
  const out = $('out'); out.className = 'msg'; out.textContent = 'Checking… (deriving the key takes a few seconds)';
  try {
    const f = $('file').files[0]; if (!f) throw new Error('Choose a .nexbak file.');
    const { header, chunks } = C.parseBackup(new Uint8Array(await f.arrayBuffer()));
    const k = await C.deriveKek($('pass').value, C.unb64(header.salt), header.iterations);
    const fk = await C.unwrapFileKey(k, header.wrapped_key); const meta = await C.decJson(fk, header.enc_meta); const facts = await C.decJson(fk, header.sealed);
    for (const key of ['id', 'created_at', 'size_bytes', 'sha256', 'row_hash']) if (String(facts[key]) !== String(header[key])) throw new Error('Backup header was altered (' + key + ')');
    const h = new C.Sha256(); const plain = []; for (const c of chunks) { const p = await C.decChunk(fk, c); h.update(p); plain.push(p); }
    if (h.hex() !== facts.sha256) throw new Error('Fingerprint mismatch: the backup is damaged.');
    out.textContent = 'Verified. "' + (meta.title || meta.name) + '" is identical to the original.\nSHA-256 ' + facts.sha256 + '\nSaved in vault: ' + facts.created_at + '\nRecord fingerprint: ' + facts.row_hash + '\nOriginal file name: ' + meta.name;
    saveBlob(new Blob(plain, { type: meta.type || 'application/octet-stream' }), meta.name || 'restored');
  } catch (e) { out.className = 'msg bad'; out.textContent = 'Failed: ' + (e.name === 'OperationError' ? 'wrong passphrase or damaged file' : (e.message || e)); }
};

</script></body></html>
